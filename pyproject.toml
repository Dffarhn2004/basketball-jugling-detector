[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-bounce-counter"
version = "0.1.0"
description = "Auditable basketball floor-contact event pipeline"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
phase0 = ["pytest>=8,<9", "torch>=2.2", "ultralytics>=8.3", "opencv-python>=4.9"]

[project.scripts]
bounce-counter = "bounce_counter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
